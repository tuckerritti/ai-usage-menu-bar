name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_DIR: ${{ runner.temp }}/ai-usage-release
      NOTARYTOOL_PROFILE: ai-usage-notary
      NOTARYTOOL_KEYCHAIN: ${{ runner.temp }}/ai-usage-signing.keychain-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_TYPE" == tag && "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]
          commit=$(git rev-parse HEAD)
          [[ "$commit" == "$(git rev-parse "$GITHUB_SHA^{commit}")" ]]
          [[ "$commit" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 26.3'
          xcodebuild -project AIUsage.xcodeproj -scheme AIUsage -configuration Release \
            -showBuildSettings -json >"$RUNNER_TEMP/release-settings.json"
          version=$(jq -er '[.[] | select(.target == "AIUsage")][0].buildSettings.MARKETING_VERSION' \
            "$RUNNER_TEMP/release-settings.json")
          [[ "$RELEASE_TAG" == "v$version" ]] || { printf 'Tag must equal v%s.\n' "$version" >&2; exit 1; }
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          [[ "$remote_commit" == "$commit" ]] || { printf 'The remote tag moved.\n' >&2; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
            >"$RUNNER_TEMP/existing-releases.txt"
          if grep -Fx -- "$RELEASE_TAG" "$RUNNER_TEMP/existing-releases.txt" >/dev/null; then
            printf 'A release already exists for %s; it will not be overwritten.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Run checks before loading credentials
        id: checks
        run: |
          ./Tests/check.sh --lifecycle
          ./Tests/ReleaseChecks.sh
          ruby ./Tests/WorkflowChecks.rb

      - name: Install signing credentials
        id: credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: |
          : "${DEVELOPER_ID_P12_BASE64:?Missing DEVELOPER_ID_P12_BASE64}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing DEVELOPER_ID_P12_PASSWORD}"
          : "${NOTARIZATION_PASSWORD:?Missing NOTARIZATION_PASSWORD}"
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${DEVELOPER_ID_APPLICATION:?Missing DEVELOPER_ID_APPLICATION}"
          umask 077
          certificate="$RUNNER_TEMP/ai-usage-certificate.p12"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 --decode >"$certificate"
          keychain_password=$(/usr/bin/openssl rand -base64 32)
          printf '::add-mask::%s\n' "$keychain_password"
          security create-keychain -p "$keychain_password" "$NOTARYTOOL_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$NOTARYTOOL_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$NOTARYTOOL_KEYCHAIN"
          security import "$certificate" -k "$NOTARYTOOL_KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -x -T /usr/bin/codesign -T /usr/bin/security
          rm -f -- "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" \
            "$NOTARYTOOL_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$NOTARYTOOL_KEYCHAIN"
          identities=$(security find-identity -v -p codesigning "$NOTARYTOOL_KEYCHAIN")
          printf '%s\n' "$identities" | grep -F -- "\"$DEVELOPER_ID_APPLICATION\"" >/dev/null
          printf '%s\n' "$identities" | grep -E '^[[:space:]]*1 valid identities found$' >/dev/null
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARIZATION_PASSWORD" \
            --keychain "$NOTARYTOOL_KEYCHAIN"

      - name: Build signed and notarized DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: ./scripts/release.sh

      - name: Publish verified release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          [[ "$remote_commit" == "$(git rev-parse HEAD)" ]] || { printf 'The remote tag moved.\n' >&2; exit 1; }
          shopt -s nullglob
          dmgs=("$RELEASE_DIR"/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]]
          dmg=${dmgs[0]}
          checksum="$dmg.sha256"
          [[ -f "$checksum" ]]
          (cd "$RELEASE_DIR" && shasum -a 256 -c "$(basename "$checksum")")
          gh release create "$RELEASE_TAG" "$dmg" "$checksum" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --draft
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft \
            >"$RUNNER_TEMP/draft-release.json"
          jq -e --arg dmg "$(basename "$dmg")" --arg checksum "$(basename "$checksum")" \
            '.isDraft and ([.assets[].name] | sort) == ([$dmg, $checksum] | sort)' \
            "$RUNNER_TEMP/draft-release.json" >/dev/null
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          [[ "$remote_commit" == "$(git rev-parse HEAD)" ]] || { printf 'The remote tag moved; release remains a draft.\n' >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/ai-usage-certificate.p12"
          if [[ -f "$NOTARYTOOL_KEYCHAIN" ]]; then
            security delete-keychain "$NOTARYTOOL_KEYCHAIN"
          fi
