name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      NOTARYTOOL_PROFILE: ai-usage-notary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set release paths
        run: |
          printf 'RELEASE_DIR=%s\n' "$RUNNER_TEMP/ai-usage-release" >>"$GITHUB_ENV"
          printf 'NOTARYTOOL_KEYCHAIN=%s\n' "$RUNNER_TEMP/ai-usage-signing.keychain-db" >>"$GITHUB_ENV"

      - name: Verify release source
        id: source
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] \
            || { printf 'Release requires a push to main.\n' >&2; exit 1; }
          commit=$(git rev-parse HEAD)
          [[ "$commit" == "$(git rev-parse "$GITHUB_SHA^{commit}")" ]] \
            || { printf 'The checkout does not match the triggering commit.\n' >&2; exit 1; }
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 26.3'

      - name: Run checks before loading credentials
        id: checks
        run: |
          ./Tests/check.sh --lifecycle
          ./Tests/ReleaseChecks.sh
          ruby ./Tests/WorkflowChecks.rb

      - name: Tag next patch release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag --list --sort=-version:refname \
            | awk '/^v[0-9]+\.[0-9]+(\.[0-9]+)?$/ && !found { print; found=1 }')
          if [[ -n "$latest" ]]; then
            git merge-base --is-ancestor "refs/tags/$latest" "$GITHUB_SHA" \
              || { printf 'A newer or unrelated commit is already tagged for release.\n' >&2; exit 1; }
          fi
          tag=$(git tag --points-at "$GITHUB_SHA" --sort=-version:refname \
            | awk '/^v[0-9]+\.[0-9]+(\.[0-9]+)?$/ && !found { print; found=1 }')
          if [[ -z "$tag" ]]; then
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v$major.$minor.$((10#${patch:-0} + 1))"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$tag" --jq .sha)
          [[ "$remote_commit" == "$GITHUB_SHA" ]] || { printf 'The remote tag moved.\n' >&2; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
            >"$RUNNER_TEMP/existing-releases.txt"
          if grep -Fx -- "$tag" "$RUNNER_TEMP/existing-releases.txt" >/dev/null; then
            printf 'A release already exists for %s; it will not be overwritten.\n' "$tag" >&2
            exit 1
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >>"$GITHUB_ENV"

      - name: Install signing credentials
        id: credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: |
          : "${DEVELOPER_ID_P12_BASE64:?Missing DEVELOPER_ID_P12_BASE64}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing DEVELOPER_ID_P12_PASSWORD}"
          : "${NOTARIZATION_PASSWORD:?Missing NOTARIZATION_PASSWORD}"
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${DEVELOPER_ID_APPLICATION:?Missing DEVELOPER_ID_APPLICATION}"
          umask 077
          certificate="$RUNNER_TEMP/ai-usage-certificate.p12"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 --decode >"$certificate"
          keychain_password=$(/usr/bin/openssl rand -base64 32)
          printf '::add-mask::%s\n' "$keychain_password"
          security create-keychain -p "$keychain_password" "$NOTARYTOOL_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$NOTARYTOOL_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$NOTARYTOOL_KEYCHAIN"
          security import "$certificate" -k "$NOTARYTOOL_KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -x -T /usr/bin/codesign -T /usr/bin/security
          rm -f -- "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" \
            "$NOTARYTOOL_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$NOTARYTOOL_KEYCHAIN"
          identities=$(security find-identity -v -p codesigning "$NOTARYTOOL_KEYCHAIN")
          printf '%s\n' "$identities" | grep -F -- "\"$DEVELOPER_ID_APPLICATION\"" >/dev/null
          printf '%s\n' "$identities" | grep -E '^[[:space:]]*1 valid identities found$' >/dev/null
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARIZATION_PASSWORD" \
            --keychain "$NOTARYTOOL_KEYCHAIN"

      - name: Build signed and notarized DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/release.sh

      - name: Publish verified release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          [[ "$remote_commit" == "$(git rev-parse HEAD)" ]] || { printf 'The remote tag moved.\n' >&2; exit 1; }
          shopt -s nullglob
          dmgs=("$RELEASE_DIR"/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]]
          dmg=${dmgs[0]}
          checksum="$dmg.sha256"
          [[ -f "$checksum" ]]
          (cd "$RELEASE_DIR" && shasum -a 256 -c "$(basename "$checksum")")
          gh release create "$RELEASE_TAG" "$dmg" "$checksum" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --draft
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft \
            >"$RUNNER_TEMP/draft-release.json"
          jq -e --arg dmg "$(basename "$dmg")" --arg checksum "$(basename "$checksum")" \
            '.isDraft and ([.assets[].name] | sort) == ([$dmg, $checksum] | sort)' \
            "$RUNNER_TEMP/draft-release.json" >/dev/null
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          [[ "$remote_commit" == "$(git rev-parse HEAD)" ]] || { printf 'The remote tag moved; release remains a draft.\n' >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/ai-usage-certificate.p12"
          if [[ -f "$NOTARYTOOL_KEYCHAIN" ]]; then
            security delete-keychain "$NOTARYTOOL_KEYCHAIN"
          fi

  homebrew:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-15
    timeout-minutes: 10
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate cask for latest release
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { printf 'Expected a numeric release tag.\n' >&2; exit 1; }
          printf 'RELEASE_TAG=%s\n' "$tag" >>"$GITHUB_ENV"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "AI-Usage-${tag#v}-*.dmg.sha256" --dir "$RUNNER_TEMP/homebrew"
          shopt -s nullglob
          checksums=("$RUNNER_TEMP"/homebrew/*.dmg.sha256)
          [[ ${#checksums[@]} -eq 1 ]]
          ./scripts/homebrew-cask.sh "${checksums[0]}" >"$RUNNER_TEMP/homebrew/ai-usage.rb"

      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tuckerritti/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          persist-credentials: true

      - name: Update Homebrew tap
        working-directory: homebrew-tap
        run: |
          mkdir -p Casks
          cp "$RUNNER_TEMP/homebrew/ai-usage.rb" Casks/ai-usage.rb
          git add Casks/ai-usage.rb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "ai-usage $RELEASE_TAG"
          git push origin HEAD:main
